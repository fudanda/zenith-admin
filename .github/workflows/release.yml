name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build Go and original dashboard
        env:
          VITE_DEPLOYMENT_ID: release-artifact
        run: npm run build

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Go artifacts
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          CGO_ENABLED: '0'
        run: |
          for TARGET in linux-amd64 windows-amd64; do
            OS="${TARGET%-*}"
            ARCH="${TARGET#*-}"
            DIR="$PWD/release_artifacts/zenith-admin-${TARGET}"
            mkdir -p "$DIR"
            EXECUTABLE=zenith
            if [ "$OS" = windows ]; then EXECUTABLE=zenith.exe; fi
            (cd backend && GOOS="$OS" GOARCH="$ARCH" go build -trimpath -o "$DIR/$EXECUTABLE" ./cmd/zenith)
            cp .env.production.example "$DIR/env.example"
            cp docs/guide/go-foundation.md "$DIR/README.md"
            cp docs/guide/go-integrations.md "$DIR/go-integrations.md"
            cp -r backend/migrations "$DIR/migrations"
            (cd release_artifacts && zip -r "../zenith-admin-${TARGET}-${RELEASE_TAG}.zip" "zenith-admin-${TARGET}")
          done

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG;
            const content = fs.readFileSync('docs/changelog/index.md', 'utf-8');
            const start = content.indexOf('## ' + tag);
            if (start < 0) {
              fs.writeFileSync('RELEASE_NOTES.md', '请查阅 [CHANGELOG](https://iwangbowen.github.io/zenith-admin/changelog/) 获取完整变更信息。');
              process.exit(0);
            }
            const end = content.indexOf('\n## ', start + 1);
            const notes = content.slice(start, end > 0 ? end : undefined).trim();
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-alpha') }}
          files: |
            zenith-admin-linux-amd64-${{ steps.tag.outputs.name }}.zip
            zenith-admin-windows-amd64-${{ steps.tag.outputs.name }}.zip
