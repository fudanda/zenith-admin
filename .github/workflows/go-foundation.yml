name: Go foundation
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zenith
          POSTGRES_PASSWORD: zenith_test
          POSTGRES_DB: zenith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenith -d zenith_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZENITH_TEST_DATABASE_URL: postgres://zenith:zenith_test@localhost:5432/zenith_test?sslmode=disable
      ZENITH_TEST_S3_ENDPOINT: http://127.0.0.1:19000
      ZENITH_TEST_S3_ACCESS_KEY: zenith_test
      ZENITH_TEST_S3_SECRET_KEY: zenith_s3_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name zenith-s3-ci -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=zenith_test -e MINIO_ROOT_PASSWORD=zenith_s3_test_only minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:19000/minio/health/ready && exit 0; sleep 1; done
          docker logs zenith-s3-ci
          exit 1
      - run: npm run check:foundation-contracts
      - run: npm run check:foundation-ui
      - run: npm run generate:foundation-go-models
      - run: git diff --exit-code -- backend/internal/contracts
      - run: npm run check:types
      - run: npm run lint
      - run: npm run test:shared
      - run: npm run test:client && npm run test:elements && npm run test:admin
      - run: go test ./...
        working-directory: backend
      - run: npm run build
      - run: npm run build:admin:example && npm run build:elements:example
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run src/providers/GoAuthProvider.test.tsx src/lib/go-transport.test.ts src/lib/go-auth-api.test.ts src/lib/foundation-operations.test.ts src/lib/contract-query.test.tsx src/hooks/PreferencesProvider.test.tsx --maxWorkers=3
        working-directory: packages/web
      - run: ZENITH_BROWSER_TEST_NODE="$(command -v node)" go test -tags integration ./...
        working-directory: backend
      - run: ZENITH_BROWSER_TEST_NODE="$(command -v node)" ZENITH_BROWSER_PRODUCTION=true go test -tags integration -run TestOriginalWebFoundation .
        working-directory: backend
      - name: Verify SQLite APIs and embedded original dashboard
        env:
          ZENITH_TEST_DATABASE_URL: sqlite:./sqlite-ci.db
          ZENITH_BROWSER_PRODUCTION: 'true'
          ZENITH_DEPLOYMENT_BINARY: ${{ github.workspace }}/backend/bin/zenith
        run: ZENITH_BROWSER_TEST_NODE="$(command -v node)" go test -tags integration -count=1 ./...
        working-directory: backend
      - name: Verify HTTPS release restart and backup recovery
        env:
          ZENITH_DEPLOYMENT_BINARY: ${{ github.workspace }}/backend/bin/zenith
          ZENITH_ACCEPTANCE_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: ZENITH_BROWSER_TEST_NODE="$(command -v node)" go test -tags integration -count=1 -run TestReleaseHTTPSBackupRecovery -v .
        working-directory: backend
