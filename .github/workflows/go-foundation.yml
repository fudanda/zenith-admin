name: Go foundation
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zenith
          POSTGRES_PASSWORD: zenith_test
          POSTGRES_DB: zenith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenith -d zenith_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZENITH_TEST_DATABASE_URL: postgres://zenith:zenith_test@localhost:5432/zenith_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run check:foundation-contracts
      - run: npm run generate:foundation-go-models
      - run: git diff --exit-code -- backend/internal/contracts
      - run: go test ./...
        working-directory: backend
      - run: go test -tags integration ./...
        working-directory: backend
